externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact: {}
  description: This is a guest management server.
  title: Guest Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email and password, and issues an access + refresh token
        pair.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_auth.TokenPair'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "401":
          description: Invalid email or password
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access + refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_auth.TokenPair'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "401":
          description: Invalid, expired, or non-refresh token
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Refresh access token
      tags:
      - auth
  /api/v1/event-categories:
    get:
      consumes:
      - application/json
      description: 'Returns a paginated list of event categories. Query: page, size,
        sort=field,dir (repeatable), filter by allowed fields (name, source, tenant_id).'
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: size
        type: integer
      - description: 'Sort: field,dir (e.g. sort=name,ASC&sort=id,DESC)'
        in: query
        name: sort
        type: string
      - description: Filter by name (exact match)
        in: query
        name: name
        type: string
      - description: Filter by source (exact match)
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageResponse-internal_features_events_category_EventCategory'
        "400":
          description: Invalid query (e.g. invalid sort field)
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List event categories
      tags:
      - event-categories
    post:
      consumes:
      - application/json
      description: Creates a new event category. Source must be "app" or "tenant";
        tenant_id required when source is "tenant".
      parameters:
      - description: Event category payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_category.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_events_category.EventCategory'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "409":
          description: Conflict (e.g. already exists)
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create event category
      tags:
      - event-categories
  /api/v1/event-categories/{category_id}/workflow-step-templates:
    get:
      consumes:
      - application/json
      description: 'Returns a paginated list of workflow step templates for an event
        category. Query: page, size, sort=field,dir (repeatable), filter by allowed
        fields (name).'
      parameters:
      - description: Event category UUID
        in: path
        name: category_id
        required: true
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: size
        type: integer
      - description: 'Sort: field,dir (e.g. sort=order_index,ASC)'
        in: query
        name: sort
        type: string
      - description: Filter by name (exact match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageResponse-internal_features_events_workflowsteptemplate_WorkflowStepTemplate'
        "400":
          description: Invalid category id or query
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List workflow step templates
      tags:
      - workflow-step-templates
    post:
      consumes:
      - application/json
      description: Creates a new workflow step template under an event category. order_index
        must be unique per category.
      parameters:
      - description: Event category UUID
        in: path
        name: category_id
        required: true
        type: string
      - description: Workflow step template payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_workflowsteptemplate.CreateWorkflowStepTemplateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_events_workflowsteptemplate.WorkflowStepTemplate'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "409":
          description: Conflict (order_index already used for this category)
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create workflow step template
      tags:
      - workflow-step-templates
  /api/v1/event-categories/{category_id}/workflow-step-templates/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-deletes a workflow step template by ID, scoped to its event
        category.
      parameters:
      - description: Event category UUID
        in: path
        name: category_id
