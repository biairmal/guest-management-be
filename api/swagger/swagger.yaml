securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token issued by
      POST /api/v1/auth/login (e.g. "Bearer eyJhbGciOiJIUzI1NiIs...").
    in: header
    name: Authorization
    type: apiKey
