host: localhost:8080
info:
  contact: {}
  description: This is a guest management server.
  title: Guest Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email and password, and issues an access + refresh token
        pair.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_auth.TokenPair'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "401":
          description: Invalid email or password
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access + refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_auth.TokenPair'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "401":
          description: Invalid, expired, or non-refresh token
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Refresh access token
      tags:
      - auth
  /api/v1/event-categories:
    get:
      consumes:
      - application/json
      description: 'Returns a paginated list of event categories. Query: page, size,
        sort=field,dir (repeatable), filter by allowed fields (name, source, tenant_id).'
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: size
        type: integer
      - description: 'Sort: field,dir (e.g. sort=name,ASC&sort=id,DESC)'
        in: query
        name: sort
        type: string
      - description: Filter by name (exact match)
        in: query
        name: name
        type: string
      - description: Filter by source (exact match)
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageResponse-internal_features_events_EventCategory'
        "400":
          description: Invalid query (e.g. invalid sort field)
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List event categories
      tags:
      - event-categories
    post:
      consumes:
      - application/json
      description: Creates a new event category. Source must be "app" or "tenant";
        tenant_id required when source is "tenant".
      parameters:
      - description: Event category payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_events.EventCategory'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "409":
          description: Conflict (e.g. already exists)
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create event category
      tags:
      - event-categories
  /api/v1/event-categories/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-deletes an event category by ID.
      parameters:
      - description: Event category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: Event category not found
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete event category
      tags:
      - event-categories
    get:
      consumes:
      - application/json
      description: Returns a single event category by UUID.
      parameters:
      - description: Event category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_events.EventCategory'
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: Event category not found
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get event category by ID
      tags:
      - event-categories
    put:
      consumes:
      - application/json
      description: Updates an existing event category by ID. Only provided fields
        are applied (partial update).
      parameters:
      - description: Event category UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_events.EventCategory'
        "400":
          description: Invalid ID or request body
          schema:
            type: object
        "404":
          description: Event category not found
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update event category
      tags:
      - event-categories
  /api/v1/events:
    get:
      consumes:
      - application/json
      description: 'Returns a paginated list of events. Query: page, size, sort=field,dir
        (repeatable), filter by allowed fields (tenant_id, category_id, name).'
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: size
        type: integer
      - description: 'Sort: field,dir (e.g. sort=start_date,ASC&sort=id,DESC)'
        in: query
        name: sort
        type: string
      - description: Filter by tenant ID (exact match)
        in: query
        name: tenant_id
        type: string
      - description: Filter by category ID (exact match)
        in: query
        name: category_id
        type: string
      - description: Filter by name (exact match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageResponse-internal_features_events_Event'
        "400":
          description: Invalid query (e.g. invalid sort field)
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Creates a new event scoped to a tenant and category. is_multi_day
        is derived from start_date/end_date.
      parameters:
      - description: Event payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events.CreateEventInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_events.Event'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "409":
          description: Conflict
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - events
  /api/v1/events/{event_id}/workflow-steps:
    get:
      consumes:
      - application/json
      description: 'Returns a paginated list of workflow steps for an event. Query:
        page, size, sort=field,dir (repeatable), filter by allowed fields (name).'
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: size
        type: integer
      - description: 'Sort: field,dir (e.g. sort=order_index,ASC)'
        in: query
        name: sort
        type: string
      - description: Filter by name (exact match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageResponse-internal_features_events_WorkflowStep'
        "400":
          description: Invalid event id or query
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List workflow steps
      tags:
      - workflow-steps
    post:
      consumes:
      - application/json
      description: Creates a new workflow step under an event. order_index must be
        unique per event.
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Workflow step payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events.CreateWorkflowStepInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_events.WorkflowStep'
        "400":
          description: Invalid request body or validation error
          schema:
            type: object
        "409":
          description: Conflict (order_index already used for this event)
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create workflow step
      tags:
      - workflow-steps
    put:
      consumes:
      - application/json
      description: 'Replaces an event''s workflow steps with the given list: entries
        with "id" are updated, entries without are created, and any existing step
        not present in the list is deleted.'
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Full desired list of workflow steps
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/internal_features_events.SyncWorkflowStepInput'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_events.WorkflowStep'
            type: array
        "400":
          description: Invalid request body, duplicate order_index, or an id not belonging
            to this event
          schema:
            type: object
        "422":
          description: Unprocessable entity
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Sync workflow steps
      tags:
      - workflow-steps
  /api/v1/events/{event_id}/workflow-steps/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-deletes a workflow step by ID, scoped to its event.
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Workflow step UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: Workflow step not found
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete workflow step
      tags:
      - workflow-steps
    get:
      consumes:
      - application/json
      description: Returns a single workflow step by UUID, scoped to its event.
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Workflow step UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_events.WorkflowStep'
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: Workflow step not found
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get workflow step by ID
      tags:
      - workflow-steps
    put:
      consumes:
      - application/json
      description: Updates an existing workflow step by ID. Only provided fields are
        applied (partial update); event_id is immutable.
      parameters:
      - description: Event UUID
        in: path
        name: event_id
        required: true
        type: string
      - description: Workflow step UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_events.UpdateWorkflowStepInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_events.WorkflowStep'
        "400":
          description: Invalid ID or request body
          schema:
            type: object
        "404":
          description: Workflow step not found
          schema:
            type: object
        "409":
          description: Conflict (order_index already used for this event)
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update workflow step
      tags:
