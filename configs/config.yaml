logger:
  level: debug # debug, info, warn, error, fatal, panic
  output: ${LOG_OUTPUT:stdout} # stdout, stderr, file
  format: text # json, text
  # ===== Rotation is only used if Output is file ===== #
  rotation:
  #   filename: logs/app.log
  #   max_size: 100MB
  #   max_age: 7d
  #   max_backups: 3
  #   compress: false
  #   local_time: false

server:
  host: ${SERVER_HOST:127.0.0.1}
  port: ${SERVER_PORT:8080}
  read_header_timeout: ${SERVER_READ_HEADER_TIMEOUT:5s}
  read_timeout: ${SERVER_READ_TIMEOUT:15s}
  write_timeout: ${SERVER_WRITE_TIMEOUT:15s}
  shutdown_timeout: ${SERVER_SHUTDOWN_TIMEOUT:30s}

database:
  leader:
    driver: postgres
    host: ${DATABASE_HOST}
    port: ${DATABASE_PORT}
    database: ${DATABASE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    ssl_mode: ${DATABASE_SSL_MODE:disable}
    connect_timeout: ${DATABASE_CONNECT_TIMEOUT:5s}
    max_retries: ${DATABASE_MAX_RETRIES:3}

redis:
  mode: standalone
  address: ${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:default}
  password: ${REDIS_PASSWORD}
  db: ${REDIS_DB:0}

validator:
  tag_name: validate
  field_name_tag: json # error field names match the JSON body, not Go field names

swagger:
  enabled: ${SWAGGER_ENABLED:true}
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

tracing:
  enabled: ${TRACING_ENABLED:false}
  tracer:
    service_name: guest-management-be
    service_version: ${APP_VERSION:0.0.0}
    endpoint: ${TRACING_ENDPOINT:localhost:4317}
    insecure: ${TRACING_INSECURE:true}
    sample_rate: ${TRACING_SAMPLE_RATE:1.0}

metrics:
  enabled: ${METRICS_ENABLED:true}
  metrics:
    namespace: guest_management

ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  ratelimit:
    backend: ${RATELIMIT_BACKEND:memory} # memory, redis
    rate: ${RATELIMIT_RATE:10} # permits/sec (memory backend)
    burst: ${RATELIMIT_BURST:20} # request cap (both backends)
    window: ${RATELIMIT_WINDOW:1s} # sliding window length (redis backend)
    max_keys: ${RATELIMIT_MAX_KEYS:10000} # tracked-key eviction cap (memory backend)

lifecycle:
  drain_delay: ${LIFECYCLE_DRAIN_DELAY:5s}
  shutdown_timeout: ${LIFECYCLE_SHUTDOWN_TIMEOUT:15s}
  closer_timeout: ${LIFECYCLE_CLOSER_TIMEOUT:15s}

auth:
  refresh_ttl: ${AUTH_REFRESH_TTL:168h}
  token:
    mode: local
    default_protected: true
    cache_ttl: ${AUTH_CACHE_TTL:0s}
    rules:
      - pattern: /health
        public: true
      - pattern: /ready
        public: true
      - pattern: /metrics
        public: true
      - pattern: /swagger/**
        public: true
      - method: POST
        pattern: /api/v1/auth/login
        public: true
      - method: POST
        pattern: /api/v1/auth/refresh
        public: true
      - method: POST
        pattern: /api/v1/guests/rsvp/*
        public: true
    local:
      algorithm: HS256
      hs256_secret: ${AUTH_HS256_SECRET}
    issuer:
      algorithm: HS256
      hs256_secret: ${AUTH_HS256_SECRET}
      default_ttl: ${AUTH_ACCESS_TTL:15m}
      issuer: guest-management-be

crypto:
  # Field-level PII encryption (guests.email/phone) — see go-sdk/lib/crypto.
  # Both keys are standard-base64-encoded and have no safe default; every
  # environment must set its own (32 decoded bytes for encryption_key, at
  # least 16 for blind_index_key, and the two must differ).
  encryption_key: ${GUEST_PII_ENCRYPTION_KEY}
  blind_index_key: ${GUEST_PII_BLIND_INDEX_KEY}

queue:
  # Async publish backend for guests' InvitationPublisher — see go-sdk/lib/queue.
  # "noop" (discard, safe default), "logging" (log instead of sending), or
  # "kafka" (kafka is only validated/connected when selected here).
  backend: ${QUEUE_BACKEND:noop}
  kafka:
    brokers: ${QUEUE_KAFKA_BROKERS:localhost:9092}
    auth:
      mechanism: ${QUEUE_KAFKA_AUTH_MECHANISM:none} # none, plain, scram-sha256, scram-sha512, mtls
      username: ${QUEUE_KAFKA_AUTH_USERNAME}
      password: ${QUEUE_KAFKA_AUTH_PASSWORD}
      tls:
        cert_file: ${QUEUE_KAFKA_TLS_CERT_FILE}
        key_file: ${QUEUE_KAFKA_TLS_KEY_FILE}
        ca_file: ${QUEUE_KAFKA_TLS_CA_FILE}

# Per-feature config: app.<feature>.<layer>.*. Each feature's config is one
# contiguous block (easy to lift out if the feature becomes its own service),
# separated by layer inside it. Layers with nothing to configure yet (e.g.
# events' service/handler) are omitted rather than stubbed out empty.
app:
  events:
    repository:
      category_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
      event_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
      workflow_step_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
      workflow_step_template_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  tenants:
    repository:
      tenant_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  users:
    repository:
      user_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  templates:
    repository:
      message_template_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  roles:
    repository:
      role_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
      role_permission_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind (write path unused; read-through cache only)
  staffing:
    repository:
      staff_assignment_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  tickets:
    repository:
      ticket_type_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
  guests:
    repository:
      guest_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
      ticket_cache:
        enabled: true
        ttl: 5m
        prefix: guest-management
        strategy: write_around # write_around, write_through, write_behind
